[package]
name = "organizador-fiis"
version = "0.1.0"
description = "Um painel de controle para Fundos Imobiliários"
authors = ["Você"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pacotes adicionados para a Criptografia AES-256
aes-gcm = "0.10.3"
base64 = "0.22.1"

# Pacote para gerenciar pastas do Sistema Operacional (AppData)
dirs = "5.0"
