[package]
name = "organizador-fiis"
version = "0.1.0"
description = "Um painel de controle para Fundos Imobiliários"
authors = ["Você"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pacotes adicionados para a Criptografia AES-256
# A chave nasce da senha de quem usa o app
aes-gcm = "0.10.3"
argon2 = "0.5"
base64 = "0.22.1"
zeroize = "1"

# Pacote para gerenciar pastas do Sistema Operacional (AppData)
dirs = "5.0"

# O Argon2 fica lento sem otimização, mesmo em modo de desenvolvimento
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
